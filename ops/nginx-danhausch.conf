server {
    listen 80;
    listen [::]:80;
    server_name danhausch.com www.danhausch.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/danhausch-com;
    }

    location / {
        return 301 https://danhausch.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name danhausch.com www.danhausch.com;

    ssl_certificate /etc/letsencrypt/live/danhausch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/danhausch.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/html/danhausch-com;
    index index.html;

    location ^~ /form/api/ {
        proxy_pass http://127.0.0.1:5094/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
